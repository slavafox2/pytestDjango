name: Django CI

on: 
  workflow_dispatch: # Позволяет запускать кнопкой manual
# on:   # Позволяет запускать кнопкой auto
#   push:
#     branches: [ main ]
#   pull_request:
#     branches: [ main ]

jobs:
  django-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Установка playwright, если он нужен для тестов
          # pip install pytest-playwright
          # npx playwright install --with-deps

      - name: Run Django tests
        env:
          # Убедись, что этот путь совпадает с твоим проектом!
          DJANGO_SETTINGS_MODULE: coronavstech.settings
          PYTHONPATH: api/coronavstech
        run: |
          pytest ./api/coronavstech/ -v -s

  fibonacci-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Fibonacci tests
        run: |
          pytest fibonacci/ -s -v --durations=0 --cov=.
