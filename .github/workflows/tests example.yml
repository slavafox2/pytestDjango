name: Django CI

on: [push, pull_request] # Запускать при каждом пуше

jobs:
  test:
    runs-on: ubuntu-latest # Используем Linux-сервер GitHub

    services:
      # Если нужна реальная БД (Postgres), она описывается здесь. 
      # Для SQLite (по умолчанию в Django) этот блок не нужен.

    steps:
      - uses: actions/checkout@v4 # Копируем код проекта

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # Твоя версия Python

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        env:
          DJANGO_SETTINGS_MODULE: api.coronavstech.coronavstech.settings # Путь к твоим настройкам
        run: |
          pytest