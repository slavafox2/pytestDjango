name: Django CI

on: 
  workflow_dispatch: # Позволяет запускать кнопкой manual
# on:   # Позволяет запускать кнопкой auto
  # push:
  #   branches: [ main ]
  # pull_request:
  #   branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # (опционально) кеш pip
      # - name: Cache pip
      #   uses: actions/cache@v4
      #   with:
      #     path: ~/.cache/pip
      #     key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      #     restore-keys: |
      #       ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Django tests
        env:
          DJANGO_SETTINGS_MODULE: coronavstech.settings
          PYTHONPATH: api/coronavstech
        run: |
          pytest ./api/coronavstech/ -v -s 

      - name: Run Fibonacci tests
        run: |
          pytest fibonacci/ -s -v --durations=0 --cov=.